
services:
  postgres:
    image: postgres:16-alpine
    container_name: kip-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KIP_POSTGRES_DB:-knowledge_db}
      POSTGRES_USER: ${KIP_POSTGRES_USER:-kip_user}
      POSTGRES_PASSWORD: ${KIP_POSTGRES_PASSWORD:-local_dev_password}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kip-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: